<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="asklipe Back-End Roadmap">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070A"/>
      <stop offset="1" stop-color="#161B22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2F81F7"/>
      <stop offset="1" stop-color="#58A6FF"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <g stroke="#21262D" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/><line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/><line x1="0" y1="240" x2="1200" y2="240"/>
  </g>
  <text x="60" y="95" font-family="Consolas, Menlo, monospace" font-size="22" fill="#58A6FF">$ python main.py --role back-end</text>
  <text x="60" y="165" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#F0F6FC">asklipe Back-End Roadmap</text>
  <rect x="60" y="185" width="420" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="60" y="235" font-family="Consolas, Menlo, monospace" font-size="24" fill="#8B949E">Building the future, one line of code at a time.</text>
</svg>
