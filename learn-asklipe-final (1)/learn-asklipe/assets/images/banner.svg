<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="asklipe Back-End Roadmap">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070A"/>
      <stop offset="1" stop-color="#161B22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2F81F7"/>
      <stop offset="1" stop-color="#58A6FF"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#21262D"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <text x="60" y="82" font-family="Consolas, Menlo, monospace" font-size="22" fill="#58A6FF">$ python main.py --role back-end</text>
  <text x="60" y="160" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#F0F6FC">asklipe Back-End Roadmap</text>
  <rect x="60" y="180" width="420" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="60" y="226" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#8B949E">Do zero ao deploy, uma linha de código por vez.</text>
  <g font-family="Consolas, Menlo, monospace" font-size="15" fill="#F0F6FC">
    <rect x="60"  y="256" width="90"  height="34" rx="17" fill="#0D1117" stroke="#30363D"/><text x="105" y="278" text-anchor="middle">Python</text>
    <rect x="160" y="256" width="90"  height="34" rx="17" fill="#0D1117" stroke="#30363D"/><text x="205" y="278" text-anchor="middle">FastAPI</text>
    <rect x="260" y="256" width="120" height="34" rx="17" fill="#0D1117" stroke="#30363D"/><text x="320" y="278" text-anchor="middle">PostgreSQL</text>
    <rect x="390" y="256" width="86"  height="34" rx="17" fill="#0D1117" stroke="#30363D"/><text x="433" y="278" text-anchor="middle">Docker</text>
    <rect x="486" y="256" width="60"  height="34" rx="17" fill="#0D1117" stroke="#30363D"/><text x="516" y="278" text-anchor="middle">Git</text>
    <rect x="556" y="256" width="60"  height="34" rx="17" fill="#0D1117" stroke="#30363D"/><text x="586" y="278" text-anchor="middle">AWS</text>
  </g>
  <g transform="translate(900 60)" fill="none" stroke="#58A6FF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M80 50 L20 110 L80 170"/>
    <path d="M180 50 L240 110 L180 170"/>
    <path d="M150 30 L110 190" stroke="#8B949E"/>
  </g>
</svg>
