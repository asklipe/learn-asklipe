<style>
:root{--bg:#0d0d0d;--sf:#151515;--s2:#1d1d1d;--ln:#2b2b2b;--tx:#f5f5f5;--mu:#9a9a9a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.hero{display:block;width:100%;height:auto;border-radius:28px}
.mu{color:var(--mu);margin:0}
.k{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mu);margin:0 0 4px}

.it label{display:flex;align-items:center;gap:12px;flex:1;cursor:pointer;min-width:0}
.it:has(input:checked) .lb{color:var(--mu);text-decoration:line-through}
.lb{flex:1;min-width:0}
.lb small{display:block;color:var(--mu);font-size:12px}
input[type=checkbox]{appearance:none;flex:none;width:22px;height:22px;margin:0;border:1.5px solid var(--mu);border-radius:7px;display:grid;place-content:center;cursor:pointer;background:transparent}
input[type=checkbox]:checked{background:var(--tx);border-color:var(--tx)}
input[type=checkbox]:checked::after{content:"";width:6px;height:11px;border:solid var(--bg);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.pend{opacity:.6;border-style:dashed}
.dot{width:22px;text-align:center;color:var(--mu)}
.dur{font-size:12px;color:var(--mu)}
.lk{color:var(--tx);font-size:13px;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
.ai{padding:4px 12px;font-size:12px;font-weight:600}

.foot{margin:48px 0 32px;padding-top:20px;border-top:1px solid var(--ln);font-size:13px;color:var(--mu);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ov{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.7);display:grid;place-items:center;padding:20px}
.ov[hidden],.dr[hidden]{display:none}
.box{width:min(640px,100%);background:var(--sf);border:1px solid var(--ln);border-radius:24px;padding:24px;display:grid;gap:12px}
.box h2{margin:0;font-size:20px}
.dr{position:fixed;top:0;right:0;bottom:0;z-index:10;width:min(440px,100%);background:var(--sf);border-left:1px solid var(--ln);padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));padding-top:calc(20px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:12px}
.dr h2{margin:0;font-size:16px;font-weight:500;font-family:Poppins,system-ui,sans-serif;letter-spacing:0}
.tm{font-size:28px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.log{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px;min-height:120px}
.msg{padding:10px 14px;border-radius:16px;white-space:pre-wrap;font-size:14px;max-width:92%}
.msg.u{align-self:flex-end;background:var(--tx);color:var(--bg)}
.msg.a{align-self:flex-start;background:var(--s2)}
.ic{height:36px;width:auto;border-radius:8px;flex:none;display:block}
.hd{display:flex;align-items:center;gap:16px}
.hd .ic{height:52px}
@media(max-width:560px){.sum{grid-template-columns:1fr}.it{flex-wrap:wrap}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
